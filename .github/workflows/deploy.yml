name: Deploying adev preview to Firebase

on:
  workflow_run:
    workflows: ['Build adev for preview deployment']
    types: [completed]

permissions:
  pull-requests: write
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Simulate privileged action file
        run: |
          mkdir -p actionsim
          echo ORIGINAL > actionsim/extract-artifact-metadata.js
      - name: Download attacker artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl && gh run download ${{ github.event.workflow_run.id }} -R ${{ github.repository }} -n adev-preview -D dl
          ls -la dl
      - name: Extract like the composite action
        run: |
          tar --version | head -1
          mkdir -p pub
          set +e
          tar -xzf dl/deploy-artifact.tar.gz -C pub
          echo "TAR_EXIT=$?"
          set -e
          echo "--- find -type l ---"
          find pub -type l || true
          echo "--- actionsim content ---"
          cat actionsim/extract-artifact-metadata.js
      - name: Report
        run: echo "done"
