name: Build adev for preview deployment

on: pull_request

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Craft attacker artifact
        run: |
          mkdir -p dist && echo '<h1>attacker controlled content</h1>' > dist/index.html
          tar -czf deploy-artifact.tar.gz -C dist .
          echo "${{ github.event.pull_request.number }}" > __metadata__pull_number.txt
          echo "${{ github.event.pull_request.head.sha }}" > __metadata__build_revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: adev-preview
          path: |
            deploy-artifact.tar.gz
            __metadata__*.txt
